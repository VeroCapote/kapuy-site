# Latido para que Supabase (plan free) no pause el proyecto por inactividad.
# Llama a public.ping() cada 3 días. Si falla, GitHub manda correo a la dueña del repo.
name: Latido Supabase
on:
  schedule:
    - cron: "17 13 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a ping()
        env:
          # Anon key pública (la misma que ya está en index.html; RLS insert-only).
          SUPABASE_URL: https://eptkrujkcgwzgeqgevxp.supabase.co
          KEY: sb_publishable_EfMv_jfTzBStf2oKUzVyow_RWKatcAe
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
